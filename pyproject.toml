[project]
name = "mujoco-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.12.0",
    "pyqt6>=6.11.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
]

[tool.ruff]
indent-width = 2
# 教材の md は手で桁を揃えたコードブロックがあるので ruff に触らせない
extend-exclude = ["docs"]

[tool.ruff.format]
indent-style = "space"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# mujoco は C 拡張 (pybind11) で型スタブを同梱していないため、
# mujoco.MjModel などが「存在しない属性」と誤検出される。その分だけ黙らせる。
reportAttributeAccessIssue = "none"
reportMissingTypeStubs = "none"
